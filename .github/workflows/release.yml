name: release
on:
  workflow_dispatch:
    inputs:
      tag: { description: 'Tag to publish, e.g. v0.1.1', required: true }
jobs:
  build:
    runs-on: macos-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Check versions match the tag
        env: { TAG: '${{ inputs.tag }}' }
        run: python3 scripts/check-versions.py "$TAG"
      - name: Build universal DMG (self-signed when the SIGNING_CERT_* secrets exist, else ad-hoc)
        env:
          SIGNING_CERT_P12: '${{ secrets.SIGNING_CERT_P12 }}'
          SIGNING_CERT_PASSWORD: '${{ secrets.SIGNING_CERT_PASSWORD }}'
        run: ./scripts/release.sh
      - name: Build the Chrome extension zip the website links to
        env: { TAG: '${{ inputs.tag }}' }
        run: |
          V="${TAG#v}"
          ./scripts/package-extension.sh
          cp "dist/heyhumanly-extension-$V.zip" "dist/$V/HeyHumanly-Chrome-$V.zip"
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}', TAG: '${{ inputs.tag }}' }
        run: |
          V="${TAG#v}"
          gh release create "$TAG" dist/$V/HeyHumanly-$V.dmg dist/$V/HeyHumanly-$V.dmg.sha256 dist/$V/HeyHumanly-Chrome-$V.zip \
            --title "HeyHumanly $V" --notes-file CHANGELOG.md --prerelease
