<!doctype html><html><head><meta charset="utf-8"><title>HeyHumanly</title><link rel="stylesheet" href="popup.css"></head><body>
<div class="top"><span class="brand">HeyHumanly</span><small id="status"></small></div>
<textarea id="t" placeholder="Paste a message. Slang and casual are fine." rows="5"></textarea>
<div class="row"><button id="go" class="p">Tighten, keep my tone</button><button id="shorter">Shorter</button><button id="formal">More formal</button></div>
<div id="out" class="out"></div>
<details class="set"><summary>Settings</summary><label>Ollama address<input id="endpoint" spellcheck="false"></label><label>Model<select id="model"><option value="">Choose automatically</option></select></label><button id="save">Save</button></details>
<p class="foot">Tip: select text on any page and press <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>H</kbd>. <a href="https://heyhumanly.com/extension/" target="_blank" rel="noopener">Setup help</a></p>
<script src="core.js"></script><script src="ui.js"></script><script src="popup.js"></script></body></html>
